<!DOCTYPE html>
<html lang="ko">
<head>

  <!-- Tailwind CSS & PDF.js CDN (인터넷 연결 시 자동 로드) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #060b14;
      color: #e2e8f0;
    }

      color: #0f172a;
      padding: 0 3px;
      border-radius: 3px;
      font-weight: 700;

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 고정 컨트롤 바 -->
  <header class="sticky top-0 z-30 bg-[#0b1322]/95 backdrop-blur border-b border-slate-800 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 py-3 space-y-3">
      <!-- 타이틀 & 보안 배지 -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold">
            ✈
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h1 class="text-base sm:text-lg font-bold text-white tracking-tight">
                KAL NOTAM PACKAGE 1·2·3 원문 캡처 & 한글 번역기
              </h1>
              <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                🔒 100% 로컬 메모리 보안 (외부 서버 전송 ZERO)
              </span>
            </div>
            <p id="fileStatusText" class="text-xs text-slate-400 mt-0.5">
              기본 샘플 탑재됨 (KE0042 SEA/ICN 핵심 노탐) — 상단 [브리핑 PDF 파일 첨부]로 새 PDF를 열면 전체 노탐이 자동 추출됩니다.
            </p>
          </div>
        </div>
      </div>

      <!-- 버튼 메뉴 & 뷰 모드 -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-2">
          <label class="cursor-pointer inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold bg-sky-600 hover:bg-sky-500 text-white shadow transition">
            <span>⬆ 브리핑 PDF 파일 첨부</span>
            <input id="pdfFileInput" type="file" accept="application/pdf" class="hidden" />
          </label>
          <button id="restoreSampleBtn" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
            📄 기본 샘플(KE0042) 복원
          </button>
          <button id="wipeMemoryBtn" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-rose-950/70 hover:bg-rose-900/80 text-rose-300 border border-rose-800/60 transition">
            🗑 메모리 즉시 파기
          </button>
        </div>

        <!-- 캡처/원문 표시 모드 스위치 -->
        <div class="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-800">
          <button data-view="both" class="view-mode-btn px-3 py-1 rounded-md text-xs font-semibold bg-sky-600 text-white">
            캡처+원문
          </button>
          <button data-view="capture" class="view-mode-btn px-3 py-1 rounded-md text-xs font-semibold text-slate-400 hover:text-white">
            캡처만
          </button>
          <button data-view="text" class="view-mode-btn px-3 py-1 rounded-md text-xs font-semibold text-slate-400 hover:text-white">
            텍스트만
          </button>
        </div>
      </div>

      <!-- 노탐번호 / 특정 단어 검색창 -->
      <div class="relative">
        <input
          id="searchInput"
          type="text"
          placeholder="노탐번호(예: A4540/26, A2472/26, Q2693/26, Z0881/26) 또는 특정 단어(CPDLC, GPS, RWY, FL390, 활주로, 폐쇄 등) 검색..."
          class="w-full pl-9 pr-20 py-2.5 rounded-lg bg-slate-900/90 border border-slate-700 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-sky-500"
        />
        <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
        <button id="clearSearchBtn" class="hidden absolute right-2.5 top-2 px-2 py-0.5 rounded text-xs bg-slate-800 hover:bg-slate-700 text-slate-300">
          지우기
        </button>
      </div>

      <!-- 패키지 1, 2, 3 필터 탭 -->
      <div id="pkgTabsContainer" class="flex flex-wrap items-center gap-2 pt-0.5"></div>

      <!-- 빠른 키워드 버튼 -->
      <div class="flex flex-wrap items-center gap-1.5 text-xs">
        <span class="text-slate-400 mr-1">빠른 키워드:</span>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="A4540/26">A4540/26</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="A2472/26">A2472/26</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="Q2693/26">Q2693/26</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="Z0881/26">Z0881/26</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="CPDLC">CPDLC</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="GPS">GPS</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="FICON">FICON</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="FL390">FL390</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="RWY">RWY</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="TWY">TWY</button>
        <button class="quick-kw px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" data-kw="CLSD">CLSD</button>
      </div>

      <!-- 공항 / FIR 서브 필터 -->
      <div id="stationFilterContainer" class="flex flex-wrap items-center gap-1.5 text-xs pt-0.5"></div>
    </div>
  </header>

  <!-- 로딩 표시창 -->
  <div id="loadingBanner" class="hidden max-w-6xl mx-auto w-full px-4 mt-4">
    <div class="p-4 rounded-xl bg-sky-950/60 border border-sky-700/60 text-sky-200 text-sm flex items-center justify-between">
      <span id="loadingMsg">PDF에서 NOTAM PACKAGE 1·2·3를 스캔하고 있습니다...</span>
      <span class="animate-pulse font-bold">처리 중...</span>
    </div>
  </div>

  <!-- 메인 노탐 카드 리스트 -->
  <main id="notamListContainer" class="max-w-6xl mx-auto w-full px-4 py-5 space-y-5 flex-1"></main>

  <script>
    // PDF.js 워커 설정
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // ---------------------------------------------------------------------------
    // 1. 공항/FIR 이름 사전
    // ---------------------------------------------------------------------------
    const STATION_NAMES = {
      KSEA: '시애틀 타코마 국제공항 (KSEA)',
      RKSI: '인천국제공항 (RKSI)',
      RKSS: '김포국제공항 (RKSS)',
      SECY: '대한민국 항공보안 공지 (SECY)',
      RJTT: '도쿄 하네다 국제공항 (RJTT)',
      RJAA: '도쿄 나리타 국제공항 (RJAA)',
      PACD: '콜드베이 공항 (PACD)',
      RJCC: '삿포로 신치토세 공항 (RJCC)',
      PAKT: '케치칸 국제공항 (PAKT)',
      PANC: '앵커리지 국제공항 (PANC)',
      PAKN: '킹살몬 공항 (PAKN)',
      PASY: '셰먀 이어렉슨 공군기지 (PASY)',
      KZSE: '시애틀 비행정보구역 (KZSE FIR)',
      CZVR: '밴쿠버 비행정보구역 (CZVR FIR)',
      PAZA: '앵커리지 비행정보구역 (PAZA FIR)',
      RJJJ: '후쿠오카 비행정보구역 (RJJJ FIR)',
      RKRR: '인천 비행정보구역 (RKRR FIR)'
    };

    // ---------------------------------------------------------------------------
    // 2. 100% 한글 직역 + 항공 전문 의역 하이브리드 엔진 (영문 잔류 ZERO)
    // ---------------------------------------------------------------------------
    function translateSingleLineToKorean(line) {
      let s = line.trim();
      if (!s) return '';

      // 1) 항로(AIRWAY) 제한/MEA/MOCA/MCA 패턴 정밀 의역
      const routeDisableMatch = s.match(/^(?:[A-Z]{2}\.\.)?ROUTE\s+([A-Z]{3})\.\s*([A-Z0-9,\s]+?)\s+([A-Z\s()]+?)\s*\(([A-Z]{3})\)\s*(VORTAC|VOR\/DME|VOR|NDB),\s*[A-Z]{2}\s+R-(\d{3})\s+TO\s+([A-Z0-9\s(),/]+?)\s+NA\s*([A-Z]*BOUND)?\s*EXCEPT\s+FOR\s+ACFT\s+EQUIPPED\s+WITH\s+SUITABLE\s+RNAV\s+SYSTEM\s+WITH\s+GPS\.?\s*(.*)$/i);
      if (routeDisableMatch) {
        const [, center, airway, vorName, vorId, vorType, radial, dest, dir, tail] = routeDisableMatch;
        const dirKo = dir ? (dir.toUpperCase().includes('EAST') ? '동쪽 방향(EASTBOUND) ' : dir.toUpperCase().includes('WEST') ? '서쪽 방향(WESTBOUND) ' : dir.toUpperCase().includes('NORTH') ? '북쪽 방향(NORTHBOUND) ' : dir.toUpperCase().includes('SOUTH') ? '남쪽 방향(SOUTHBOUND) ' : `${dir} 방향 `) : '';
        let tailKo = tail ? translateRestPhrase(tail) : '';
        return `[항로 제한] ${center} 관할 ${airway.trim()} 항로: ${vorName.trim()}(${vorId}) ${vorType} 레이디얼 R-${radial}부터 ${dest.trim()} 구간은 ${dirKo}운항 불가(NA) (단, GPS를 포함한 적합한 RNAV 시스템 장착 항공기는 운항 가능). ${tailKo}`.trim();
      }

      // 2) 일반 문장/절차/지침 구문 정밀 변환 사전
      const phraseReplacements = [
        [/^E\)\s*/i, '[본문] '],
        [/^D\)\s*/i, '[운영 시간/요일] '],
        [/^F\)\s*/i, '[하한 고도] '],
        [/^G\)\s*/i, '[상한 고도] '],
        [/^RMK:\s*/i, '[비고] '],
        [/^COMMENT\)\s*/i, '[운항 참고사항] '],
        [/USER PREFERRED ROUTE FLIGHT PLANNING GUIDELINES/gi, '사용자 선호 항로(UPR) 비행계획 수립 지침'],
        [/USER PREFERRED ROUTE ACFT WILL HAVE THE SAME PRIORITY FOR ALT ASSIGNMENT AS ACFT ON AN OPTIONAL PACOTS OR NOPAC TRACK\./gi, '사용자 선호 항로(UPR) 운항 항공기는 선택적 태평양 유기 항로(PACOTS) 또는 북태평양(NOPAC) 트랙 항공기와 동일한 고도 배정 우선권을 가집니다.'],
        [/EXCEPTION:\s*OPRS WHICH FLT PLAN A USER PREFERRED ROUTE THAT IS NOT LATERALLY SEPARATED FM AN OPPOSITE DIRECTION PACOTS\/NOPAC\/USER PREFERRED ROUTE TFC FLOW WILL LIKELY BE RESTRICTED VERTICALLY WHILE IN CONFLICT WITH THE MAJOR TFC FLOW/gi, '예외: 반대 방향의 PACOTS/NOPAC/UPR 주요 교통 흐름과 횡적 분리가 확보되지 않은 UPR 비행계획을 제출한 항공기는 주요 교통 흐름과 상충되는 동안 수직(고도) 제한을 받을 수 있습니다'],
        [/USER PREFERRED ROUTE ENTERY\/EXIT BTN/gi, '비행정보구역(FIR) 간 사용자 선호 항로(UPR) 진입/진출 조건 — 대상 구간:'],
        [/USER PREFERRED ROUTE ENTRY\/EXIT BTN/gi, '비행정보구역(FIR) 간 사용자 선호 항로(UPR) 진입/진출 조건 — 대상 구간:'],
        [/MUST FLT PLAN OVER ONE OF THE FOLLOWING FIXES:/gi, '반드시 다음 픽스(Fix) 중 하나를 경유하도록 비행계획을 수립해야 함:'],
        [/ANYWHERE OVER OR NE OF KATCH/gi, 'KATCH 픽스 상공 또는 북동쪽(NE) 임의 지점 경유'],
        [/ANYWHERE OVER OR BTN ZENNA AND SAYNT OR BTN/gi, 'ZENNA~SAYNT 구간 상공 또는 다음 좌표 구간 경유:'],
        [/MUST NOT FLT PLAN THROUGH THE AIRSPACE DEFINED AS/gi, '다음 좌표로 정의된 공역은 관통하도록 비행계획을 수립해서는 안 됨:'],
        [/WB USER PREFERRED ROUTE TO RJJJ FIR:/gi, '후쿠오카(RJJJ) FIR로 진입하는 서항(WB) 사용자 선호 항로(UPR) 조건:'],
        [/JOIN R220 OVER OR E OF WAYPOINT NIKLL/gi, '웨이포인트 NIKLL 상공 또는 동쪽(E)에서 R220 항로에 합류할 것'],
        [/JOIN M523 OVER OR E OF WAYPOINT HIXOR/gi, '웨이포인트 HIXOR 상공 또는 동쪽(E)에서 M523 항로에 합류할 것'],
        [/REMAIN 50NM SOUTH OF A590 AND CROSS THE PAZA\/RJJJ FIR BOUNDARY OVER OR SOUTH OF WAYPOINT AKISU\.?/gi, 'A590 항로 남쪽 50NM 이격 유지를 준수하고, 웨이포인트 AKISU 상공 또는 남쪽으로 PAZA/RJJJ FIR 경계를 통과할 것.'],
        [/EB USER PREFERRED ROUTE FM RJJJ FIR ENTER PAZA FIR OVR:/gi, '후쿠오카(RJJJ) FIR에서 앵커리지(PAZA) FIR로 진입하는 동항(EB) UPR 조건:'],
        [/FILE R580 TO OPHET THENCE USER PREFERRED ROUTE SOUTH OF R580 OR FILE R580 TO OBOYD THENCE USER PREFERRED ROUTE NORTH OF R580/gi, 'OPHET까지 R580 항로로 제출 후 R580 남쪽 UPR로 운항하거나, OBOYD까지 R580으로 제출 후 R580 북쪽 UPR로 비행계획 수립'],
        [/FILE A590 TO POWAL THENCE USER PREFERRED ROUTE NORTH OR SOUTH OF A590/gi, 'POWAL까지 A590 항로로 제출 후 A590 북쪽 또는 남쪽 UPR로 비행계획 수립'],
        [/AKISU OR SOUTH:\s*REMAIN 50NM SOUTH OF ATS ROUTE A590/gi, 'AKISU 또는 그 남쪽 경유 시: ATS 항로 A590에서 남쪽으로 50NM 이상 이격 유지'],
        [/EB ACFT OVER KUNAD, LUMES AND KOKES MUST FILE AS FOLLOWS:/gi, 'KUNAD, LUMES, KOKES를 경유하는 동항(EB) 항공기 비행계획 제출 요건:'],
        [/KOKES DIRECT ONEIL THENCE VIA USER PREFERRED ROUTE REMAINING S OF ATS ROUTE R580/gi, 'KOKES에서 ONEIL로 직항(DCT) 후 ATS 항로 R580 남쪽을 유지하는 UPR 경유'],
        [/LUMES DIRECT PINSO THENCE VIA USER PREFERRED ROUTE REMAINING\s*S OF ATS ROUTE A590/gi, 'LUMES에서 PINSO로 직항(DCT) 후 ATS 항로 A590 남쪽을 유지하는 UPR 경유'],
        [/KUNAD DIRECT PLADO THENCE VIA USER PREFERRED ROUTE REMAINING\s*S OF ATS ROUTE A590\.?/gi, 'KUNAD에서 PLADO로 직항(DCT) 후 ATS 항로 A590 남쪽을 유지하는 UPR 경유.'],
        [/ACFT MUST FLT PLAN TO CROSS KUNAD, LUMES OR KOKES AT OR BLW FL310, OR AT OR ABV FL390\.?/gi, '항공기는 KUNAD, LUMES 또는 KOKES를 FL310 이하 또는 FL390 이상으로 통과하도록 비행계획을 수립해야 함.'],
        [/ACFT MUST FLT PLAN SO AS TO CROSS KUNAD, LUMES OR KOKES BTN 0500 UTC AND 2300 UTC\.?/gi, '항공기는 0500~2300 UTC 사이에 KUNAD, LUMES 또는 KOKES를 통과하도록 비행계획을 수립해야 함.'],
        [/REFER QUESTIONS TO ANCHORAGE ARTCC INTL PROC AT TEL/gi, '관련 문의는 앵커리지 지역관제센터(ARTCC) 국제절차과 전화'],
        [/OR TO ANCHORAGE ARTCC TFC MANAGEMENT AT TEL/gi, '또는 앵커리지 ARTCC 교통관리과 전화'],
        [/EXCEPT FOR ACFT EQUIPPED WITH SUITABLE RNAV SYSTEM WITH GPS/gi, '(단, GPS가 포함된 적합한 RNAV 시스템 장착 항공기는 제외/운항 가능)'],
        [/EXCEPT FOR AIRCRAFT EQUIPPED WITH SUITABLE RNAV SYSTEM WITH GPS/gi, '(단, GPS가 포함된 적합한 RNAV 시스템 장착 항공기는 제외/운항 가능)'],
        [/EXCEPT FOR GNSS EQUIPPED AIRCRAFT/gi, '(단, GNSS 장착 항공기는 제외/운항 가능)'],
        [/(\d{3})\s+CW\s+(\d{3})\s+UNUSABLE/gi, '방위각 $1° ~ $2°(시계방향) 구간 사용 불가'],
        [/R-(\d{3})\s+CW\s+R-(\d{3})\s+RESTRICTED\s+BEYOND\s+(\d+)\s*NM\s+BELOW\s+(\d+)/gi, '레이디얼 R-$1 ~ R-$2(시계방향) 구간은 $3NM 외곽 및 $4FT 미만에서 사용 제한됨'],
        [/R-(\d{3})\s+UNUSABLE\s+BEYOND\s+(\d+)\s*NM/gi, '레이디얼 R-$1은 $2NM 외곽에서 사용 불가'],
        [/UNUSABLE\s+BEYOND\s+(\d+)\s*NM/gi, '$1NM 외곽에서 사용 불가'],
        [/UNUSABLE\s+BELOW\s+(\d+)/gi, '$1FT 미만에서 사용 불가'],
        [/DISREGARD\s+MOCA/gi, '최저장애물회피고도(MOCA) 무시'],
        [/MEA\s+GAP\s+AT\s+COP/gi, '전환점(COP)에서 최저항로고도(MEA) 불연속(GAP) 발생'],
        [/NORTHBOUND/gi, '북항(NORTHBOUND)'],
        [/SOUTHBOUND/gi, '남항(SOUTHBOUND)'],

      let summaryBullet = '';

        const dirKo = dir.includes('NORTHEAST') ? '북동쪽(NORTHEASTBOUND)' : dir.includes('EAST') ? '동쪽(EASTBOUND)' : dir;
        summaryBullet = `[항로 운항 제한 의역] 시애틀(ZSE) 관할 ${awy} 항로: 스포캔(GEG) VORTAC 레이디얼 R-${rad}에서 전환점(COP)까지 구간은 ${dirKo} 방향 운항이 불가(NA)합니다(단, GPS가 포함된 적합한 RNAV 시스템 장착 항공기는 정상 운항 가능). 또한 GEG VOR 방위각 001°~090°(시계방향) 구간은 사용할 수 없습니다.`;

    // 4. 원문 스냅샷 캡처 이미지 생성기 (고해상도 Canvas 렌더링)
    // ---------------------------------------------------------------------------
    function generateNotamSnapshotDataUrl(item) {
      const canvas = document.createElement('canvas');
      const lines = item.rawText.split('\n');
      const width = 920;
      const lineHeight = 24;
      const padding = 24;
      const height = Math.max(110, lines.length * lineHeight + padding * 2);
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      // 상단 구분선 및 헤더 강조
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText(lines[0] || `${item.station} ${item.id}`, padding, padding + 14);

      ctx.font = '15px "Courier New", monospace';
      ctx.fillStyle = '#1e293b';
      for (let i = 1; i < lines.length; i++) {
        ctx.fillText(lines[i], padding + 14, padding + 14 + i * lineHeight);
      }
      return canvas.toDataURL('image/png');
    }

    // ---------------------------------------------------------------------------
    // 5. 실제 PDF 파일 업로드 시 NOTAM PACKAGE 1, 2, 3 전 페이지 파서
    // ---------------------------------------------------------------------------
    async function parseUploadedPdf(file) {
      const loadingBanner = document.getElementById('loadingBanner');
      const loadingMsg = document.getElementById('loadingMsg');
      loadingBanner.classList.remove('hidden');

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;

        let allLines = [];
        for (let p = 1; p <= totalPages; p++) {
          loadingMsg.textContent = `PDF 페이지 분석 중... (${p} / ${totalPages} 페이지)`;
          const page = await pdf.getPage(p);
          const textContent = await page.getTextContent();

          // Y좌표 기준 줄 정렬
          const yMap = new Map();
          for (const it of textContent.items) {
            const y = Math.round(it.transform[5]);
            let matchedY = null;
            for (const key of yMap.keys()) {
              if (Math.abs(key - y) <= 4) { matchedY = key; break; }
            }
            const targetY = matchedY !== null ? matchedY : y;
            if (!yMap.has(targetY)) yMap.set(targetY, []);
            yMap.get(targetY).push({ x: it.transform[4], str: it.str });
          }

          const sortedY = Array.from(yMap.keys()).sort((a, b) => b - a);
          for (const y of sortedY) {
            const row = yMap.get(y).sort((a, b) => a.x - b.x).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
            if (row) allLines.push({ page: p, text: row });
          }
        }

        // NOTAM PACKAGE 1, 2, 3 구간 및 개별 노탐 추출
        let currentPkg = 0;
        let currentCat = 'GENERAL';
        const extracted = [];

        const headerRegex = /^(?:(\d+)\.\s*)?(\d{2}[A-Z]{3}\d{2}\s+\d{2}:\d{2})\s*(?:-\s*)?(\d{2}[A-Z]{3}\d{2}\s+\d{2}:\d{2}|UFN|PERM)\s+([A-Z]{4})\s+([A-Z]\d{4}\/\d{2}|COAD\d{2}\/\d{2}|CO-ADZ|AIP\s+SUP\s+\d+\/\d{2}|CHINA\s+SUP\s+\d+\/\d{2})$/;
        const stopRegex = /^(◼|■|\[(DEP|DEST|ALTN|REFILE|EDTO|ERA|FIR)\]|KOREAN AIR NOTAM PACKAGE|END OF KOREAN AIR NOTAM PACKAGE|SECY\s*\/\s*SECURITY)/;

        for (let i = 0; i < allLines.length; i++) {
          const line = allLines[i].text;
          if (line.includes('KOREAN AIR NOTAM PACKAGE 1')) currentPkg = 1;
          else if (line.includes('KOREAN AIR NOTAM PACKAGE 2')) currentPkg = 2;
          else if (line.includes('KOREAN AIR NOTAM PACKAGE 3')) currentPkg = 3;
          else if (line.includes('END OF KOREAN AIR NOTAM PACKAGE 3')) currentPkg = 0;

          if (currentPkg === 0) continue;

          if (line.startsWith('◼') || line.startsWith('■')) {
            currentCat = line.replace(/^[◼■]\s*/, '').trim();
            continue;
          }

          const m = line.match(headerRegex);
          if (m) {
            const validFrom = m[2];
            const validTo = m[3];
            const station = m[4];
            const id = m[5];
            const body = [line];

            for (let j = i + 1; j < allLines.length; j++) {
              const nextLine = allLines[j].text;
              if (headerRegex.test(nextLine) || stopRegex.test(nextLine)) {
                break;
              }
              if (/^(KE\s*00\d+|PRINTED AT|DEP:|REFILE:|FIR:)/.test(nextLine)) continue;
              body.push(nextLine);
              i = j;
            }

            extracted.push({
              pkg: currentPkg,
              station,
              id,
              category: currentCat,
              validFrom,
              validTo,
              page: allLines[i].page,
              rawText: body.join('\n')
            });
          }
        }

        loadingBanner.classList.add('hidden');
        if (extracted.length > 0) {
          state.notams = extracted;
          state.currentPkg = 'ALL';
          state.currentStation = 'ALL';
          document.getElementById('fileStatusText').textContent =
            `현재 로드된 패키지: ${file.name} (총 ${extracted.length}개 노탐 — Package 1·2·3 완벽 반영)`;
          renderAll();
        } else {
          alert('해당 PDF에서 NOTAM PACKAGE 1·2·3 형식을 찾지 못했습니다.');
        }
      } catch (err) {
        loadingBanner.classList.add('hidden');
        alert('PDF 분석 중 오류가 발생했습니다: ' + err.message);
      }
    }

    const state = {

      currentPkg: 'ALL',

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function highlightText(text, query) {
      const safe = escapeHtml(text);
      if (!query.trim()) return safe;
      const escapedQ = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${escapedQ})`, 'gi'), '<mark class="hl">$1</mark>');
    }

    function getFilteredNotams() {
      return state.notams.filter(item => {
        if (state.currentPkg !== 'ALL' && item.pkg !== state.currentPkg) return false;
        if (state.currentStation !== 'ALL' && item.station !== state.currentStation) return false;
        if (state.searchQuery.trim()) {
          const q = state.searchQuery.trim().toLowerCase();
          const ko = buildKoreanTranslation(item);
          const target = `${item.station} ${item.id} ${item.category} ${item.rawText} ${ko.summaryBullet} ${ko.detailedLines}`.toLowerCase();
          return target.includes(q);
        }
        return true;
      });
    }

    function renderPkgTabs() {
      const container = document.getElementById('pkgTabsContainer');
      const countAll = state.notams.length;
      const count1 = state.notams.filter(n => n.pkg === 1).length;
      const count2 = state.notams.filter(n => n.pkg === 2).length;
      const count3 = state.notams.filter(n => n.pkg === 3).length;

      const tabs = [
        { id: 'ALL', label: '전체 패키지 (ALL)', count: countAll, activeClass: 'bg-sky-600 text-white' },
        { id: 1, label: 'NOTAM PACKAGE 1 (DEP/DEST/ALTN)', count: count1, activeClass: 'bg-sky-600 text-white' },
        { id: 2, label: 'NOTAM PACKAGE 2 (REFILE/EDTO/ERA)', count: count2, activeClass: 'bg-indigo-600 text-white' },
        { id: 3, label: 'NOTAM PACKAGE 3 (FIR 항로 노탐)', count: count3, activeClass: 'bg-amber-500 text-slate-950 font-bold' }
      ];

      container.innerHTML = tabs.map(t => {
        const isActive = state.currentPkg === t.id;
        const cls = isActive
          ? t.activeClass
          : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800';
        return `
          <button data-pkg="${t.id}" class="pkg-tab-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${cls}">
            <span>${t.label}</span>
            <span class="px-1.5 py-0.2 rounded bg-black/25 text-[11px]">${t.count}</span>
          </button>
        `;
      }).join('');

      container.querySelectorAll('.pkg-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.getAttribute('data-pkg');
          state.currentPkg = val === 'ALL' ? 'ALL' : Number(val);
          state.currentStation = 'ALL';
          renderAll();
        });
      });
    }

    function renderStationFilters() {
      const container = document.getElementById('stationFilterContainer');
      const baseList = state.currentPkg === 'ALL'
        ? state.notams
        : state.notams.filter(n => n.pkg === state.currentPkg);

      const stationCounts = {};
      baseList.forEach(n => {
        stationCounts[n.station] = (stationCounts[n.station] || 0) + 1;
      });

      const stations = Object.keys(stationCounts);
      let html = `<span class="text-slate-400 mr-1">공항/FIR 필터:</span>`;
      html += `
        <button data-st="ALL" class="st-filter-btn px-2.5 py-1 rounded-md text-xs font-semibold transition ${
          state.currentStation === 'ALL' ? 'bg-sky-500 text-slate-950' : 'bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800'
        }">전체 (${baseList.length})</button>
      `;

      stations.forEach(st => {
        const isActive = state.currentStation === st;
        html += `
          <button data-st="${st}" class="st-filter-btn px-2.5 py-1 rounded-md text-xs font-semibold transition ${
            isActive ? 'bg-sky-500 text-slate-950' : 'bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800'
          }">${st} (${stationCounts[st]})</button>
        `;
      });

      container.innerHTML = html;
      container.querySelectorAll('.st-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentStation = btn.getAttribute('data-st');
          renderAll();
        });
      });
    }

      renderAll();
    });

    document.getElementById('wipeMemoryBtn').addEventListener('click', () => {
      state.notams = [];
      state.searchQuery = '';
      document.getElementById('pdfFileInput').value = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('fileStatusText').textContent =
        '브라우저 메모리 내 모든 노탐 데이터가 안전하게 즉시 파기되었습니다.';
      renderAll();
    });

    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', e => {
      state.searchQuery = e.target.value;
      clearSearchBtn.classList.toggle('hidden', !state.searchQuery);
      renderNotamCards();
    });

    clearSearchBtn.addEventListener('click', () => {
      state.searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      renderNotamCards();
    });

    document.querySelectorAll('.quick-kw').forEach(btn => {
      btn.addEventListener('click', () => {
        const kw = btn.getAttribute('data-kw');
        state.searchQuery = kw;
        searchInput.value = kw;
        clearSearchBtn.classList.remove('hidden');
        renderNotamCards();
      });
    });

    document.querySelectorAll('.view-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.viewMode = btn.getAttribute('data-view');
        document.querySelectorAll('.view-mode-btn').forEach(b => {
          const active = b.getAttribute('data-view') === state.viewMode;
          b.className = `view-mode-btn px-3 py-1 rounded-md text-xs font-semibold ${
            active ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'
          }`;
        });
        renderNotamCards();
      });
    });

    // 초기 렌더링 실행
    renderAll();
  </script>
</body>
</html>
